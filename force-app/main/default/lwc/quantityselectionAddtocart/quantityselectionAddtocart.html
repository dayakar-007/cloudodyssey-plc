<template>
    <template  if:false={isLoading}>
    <div class="quantity-selection">
        <div class="enter-quantity">
            <lightning-button 
                label="-" 
                variant="neutral" 
                onclick={handleDecrement}
                disabled={isDecrementDisabled}>
            </lightning-button>

            <span class="quantity">{quantity}</span>

            <lightning-button 
                label="+" 
                variant="neutral" 
                onclick={handleIncrement}
                disabled={isIncrementDisabled}>
            </lightning-button>
        </div>
        <div class="add-cart">
            <lightning-button 
                label="Add to Cart" 
                variant="brand" 
                onclick={handleAddToCart}>
            </lightning-button>
        </div>
    </div>
    <template if:true={CartSelectionstatus}>
        <button onclick={closeCartSelection}> X</button>
        <div class="cart-selection">
            <template for:each={carts} for:item="cart">
                <c-cart-selection key={cart.key} cartreference = {cart.key} cartname={cart.value} oncartselected = {addProductsToCart}></c-cart-selection>
            </template>
        </div>
    </template>
    </template>
    <template if:true={isLoading}>
        <div class="exampleHolder">
        <lightning-spinner alternative-text="Loading" size="xx-small"></lightning-spinner>
    </div>
    </template>
    
</template>
